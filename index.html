<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photoshop Certification Practice Quiz</title><style>body{font-family:Arial,sans-serif;background:#f0f4f8;color:#172638;margin:0;padding:24px}.wrap{max-width:800px;margin:auto;background:white;border-radius:14px;padding:30px;box-shadow:0 5px 30px #0001}h1{color:#0878b9;font-size:27px}.meta{color:#576675}.option{display:block;border:1px solid #cdd8e4;border-radius:9px;padding:14px;margin:10px 0;cursor:pointer}.option:hover{background:#f1f8ff}.option:has(input:checked){border-color:#0878b9;background:#e8f5ff}input{margin-right:12px}button{background:#0878b9;color:white;border:0;border-radius:8px;padding:12px 20px;font-size:16px;cursor:pointer;margin:8px 8px 8px 0}button:disabled{background:#a9bac7;cursor:default}#progress{color:#53677a;font-weight:bold}.review{border-top:1px solid #ddd;padding:12px 0}.correct{color:#087b50}.wrong{color:#b62929}@media print{button{display:none}.wrap{box-shadow:none}}</style></head><body><main class="wrap"><h1>Adobe Photoshop Certification Practice Quiz</h1><p class="meta">20 questions • Based on the supplied certification practice screenshots • Choose two answers where indicated.</p><div id="app"></div></main><script>const qs=[{"question": "Which term describes a creation of the mind?", "options": ["Attribution", "Intellectual Property", "Usage rights", "Public Domain"], "correct": [1]}, {"question": "What is the term for crediting the original creator?", "options": ["Copyright", "Public Domain", "Attribution", "Usage rights"], "correct": [2]}, {"question": "Which Photoshop feature allows non-destructive filter editing?", "options": ["Regular Filter", "Rasterize Layer", "Flatten Image", "Smart Filter"], "correct": [3]}, {"question": "Which layer type contains editable text?", "options": ["Type Layer", "Pixel Layer", "Shape Layer", "Adjustment Layer"], "correct": [0]}, {"question": "What is the purpose of a layer mask?", "options": ["Permanently erase pixels", "Convert a layer to text", "Hide or reveal portions of a layer", "Change document resolution"], "correct": [2]}, {"question": "What controls spacing between two specific characters?", "options": ["Leading", "Kerning", "Tracking", "Baseline"], "correct": [1]}, {"question": "What controls spacing between lines of text?", "options": ["Tracking", "Kerning", "Baseline", "Leading"], "correct": [3]}, {"question": "The Magic Wand selects pixels based on color similarities.", "options": ["True", "False"], "correct": [0]}, {"question": "The Rectangular Marquee is the only marquee tool available.", "options": ["True", "False"], "correct": [1]}, {"question": "Which tool lightens selected areas of an image?", "options": ["Burn", "Smudge", "Dodge", "Sponge"], "correct": [2]}, {"question": "Which tool adjusts color saturation?", "options": ["Sponge", "Burn", "Dodge", "Smudge"], "correct": [0]}, {"question": "Which two portions of a Photoshop document can be exported as JPG files?", "options": ["Artboards", "Effects alone", "Layers", "Guides"], "correct": [0, 2]}, {"question": "Which two deliverables are typically provided to clients during a design project?", "options": ["Project specifications", "Resource allocation", "Design comps", "Employee schedules"], "correct": [0, 2]}, {"question": "Which Path Operation cuts one shape out of another?", "options": ["Combine Shapes", "Subtract Front Shape", "Merge Shape Components", "Intersect Shape Areas"], "correct": [1]}, {"question": "What is the main subject or area of attention in a photo called?", "options": ["Field of view", "Space", "Framing", "Focal point"], "correct": [3]}, {"question": "Which two choices improve visual hierarchy?", "options": ["Font and font size", "Repetition", "Symmetry", "Color"], "correct": [0, 3]}, {"question": "Which aspect ratio is commonly used for widescreen displays?", "options": ["4:3", "16:9", "1:1", "2.39:1"], "correct": [1]}, {"question": "Which principle describes visually pleasing relationships among design elements?", "options": ["Harmony", "Alignment", "Repetition", "White space"], "correct": [0]}, {"question": "What is the color balance setting on a digital camera called?", "options": ["Depth of field", "Frame balance", "White balance", "Rule of thirds"], "correct": [2]}, {"question": "Which design principle places related elements close together?", "options": ["Cropping", "Framing", "Resampling", "Proximity"], "correct": [3]}];let index=0;let answers=Array.from({length:qs.length},()=>[]);let finished=false;const app=document.getElementById('app');function choose(i){let a=answers[index],q=qs[index];if(q.correct.length===1)answers[index]=[i];else answers[index]=a.includes(i)?a.filter(x=>x!==i):a.length<2?[...a,i]:[a[1],i];render()}function score(){return qs.reduce((s,q,i)=>s+(answers[i].length===q.correct.length&&q.correct.every(k=>answers[i].includes(k))?1:0),0)}function render(){if(finished){let n=score();app.innerHTML=`<h2>Score: ${n}/20 (${Math.round(n*5)}%)</h2><p>Review your answers below.</p>`+qs.map((q,i)=>{let good=answers[i].length===q.correct.length&&q.correct.every(k=>answers[i].includes(k));return `<div class="review"><strong>${i+1}. ${q.question}</strong><p class="${good?'correct':'wrong'}">${good?'✓':'✗'} Your answer: ${answers[i].map(k=>q.options[k]).join(', ')||'None'}</p><p class="correct">Correct answer: ${q.correct.map(k=>q.options[k]).join(', ')}</p></div>`}).join('')+`<button onclick="finished=false;index=0;answers=Array.from({length:qs.length},()=>[]);render()">Retake quiz</button><button onclick="window.print()">Print results</button>`;return}let q=qs[index];app.innerHTML=`<p id="progress">Question ${index+1} of ${qs.length} | ${answers.filter(a=>a.length).length} answered</p><h2>${index+1}. ${q.question}</h2><p class="meta">${q.correct.length===2?'Select TWO answers.':'Select ONE answer.'}</p>`+q.options.map((o,i)=>`<label class="option"><input type="${q.correct.length===2?'checkbox':'radio'}" name="answer" ${answers[index].includes(i)?'checked':''} onchange="choose(${i})">${'ABCD'[i]}. ${o}</label>`).join('')+`<button ${index===0?'disabled':''} onclick="index--;render()">Previous</button>${index<qs.length-1?`<button onclick="index++;render()">Next</button>`:`<button ${answers.some((a,i)=>a.length!==qs[i].correct.length)?'disabled':''} onclick="finished=true;render()">Submit quiz</button>`}`};render();</script></body></html>
